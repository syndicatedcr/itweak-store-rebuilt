<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6989a5">
  <meta name="description" content="A new reconstruction of iTweak Store. Explore a classic iOS-inspired catalog, preview sample packages, and build your collection.">
  <title>iTweak Store — Rebuilt</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-gear" viewBox="0 0 48 48"><path d="m20 3 8 0 2 7 5 3 7-2 4 7-5 5v5l5 5-4 7-7-2-5 3-2 6h-8l-2-6-5-3-7 2-4-7 5-5v-5l-5-5 4-7 7 2 5-3z" fill="currentColor"/><circle cx="24" cy="25" r="10" fill="#54616b"/><circle cx="24" cy="25" r="5" fill="currentColor"/></symbol>
    <symbol id="i-paint" viewBox="0 0 48 48"><path d="M8 9h31v13H8zM36 22v8H24v12" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/><path d="M17 8v14" stroke="#fff" stroke-opacity=".3" stroke-width="5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 48 48"><path d="M6 12h36M6 24h36M6 36h36" stroke="currentColor" stroke-width="3"/><g fill="currentColor"><rect x="12" y="7" width="7" height="10" rx="2"/><rect x="30" y="19" width="7" height="10" rx="2"/><rect x="19" y="31" width="7" height="10" rx="2"/></g></symbol>
    <symbol id="i-star" viewBox="0 0 48 48"><path d="m24 4 6 13 14 2-10 10 3 15-13-7-13 7 3-15L4 19l14-2z" fill="currentColor"/></symbol>
    <symbol id="i-folder" viewBox="0 0 48 48"><path d="M4 10h16l5 6h19v25H4z" fill="currentColor"/><path d="M4 21h40" stroke="#fff" stroke-opacity=".4" stroke-width="3"/></symbol>
    <symbol id="i-music" viewBox="0 0 48 48"><path d="M19 34V11l22-5v24M19 17l22-5" fill="none" stroke="currentColor" stroke-width="5"/><ellipse cx="12" cy="36" rx="8" ry="6" fill="currentColor"/><ellipse cx="34" cy="32" rx="8" ry="6" fill="currentColor"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 48 48"><path d="M28 2 8 27h15l-3 19 21-27H26z" fill="currentColor"/></symbol>
    <symbol id="i-clock" viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="4"/><path d="M24 10v15l10 6" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 48 48"><path d="M12 36a10 10 0 0 1-2-20 14 14 0 0 1 27 0 10 10 0 0 1 0 20z" fill="currentColor"/></symbol>
    <symbol id="i-search" viewBox="0 0 48 48"><circle cx="20" cy="20" r="13" fill="none" stroke="currentColor" stroke-width="5"/><path d="m30 30 12 12" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 48 48"><g fill="currentColor"><rect x="5" y="5" width="16" height="16" rx="3"/><rect x="27" y="5" width="16" height="16" rx="3"/><rect x="5" y="27" width="16" height="16" rx="3"/><rect x="27" y="27" width="16" height="16" rx="3"/></g></symbol>
    <symbol id="i-heart" viewBox="0 0 48 48"><path d="M24 42 6 25C-5 12 12-1 24 12 36-1 53 12 42 25z" fill="currentColor"/></symbol>
  </defs></svg>
  <a class="skip" href="#main">Skip to packages</a>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="#home"><span class="app-icon steel brand-icon"><svg><use href="#i-gear"/></svg></span><span>iTweak <strong>Store</strong><small>THE CLASSIC, REBUILT.</small></span></a>
      <div class="edition"><span class="green-dot"></span> A fresh start <span class="edition-year">/ 2026</span></div>
    </header>
    <div class="store-window">
      <header class="titlebar"><button class="chrome-button" data-route="news">News</button><a href="#home" class="window-title">iTweak</a><button class="chrome-button" data-route="about">About</button></header>
      <div class="toolbar">
        <div class="segments" aria-label="Store sections"><button data-route="home" id="store-tab">Store</button><button data-route="updates" id="updates-tab">Updates</button></div>
        <label class="search"><svg aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Search packages" aria-label="Search packages" autocomplete="off"><kbd>/</kbd></label>
      </div>
      <div class="workspace">
        <aside class="sidebar"><h2>Discover</h2><nav aria-label="Store navigation" id="navigation"></nav><h2 class="genre-label">Browse by genre</h2><nav aria-label="Package genres" id="categories"></nav><button class="catalog-button" data-route="catalog"><svg aria-hidden="true"><use href="#i-folder"/></svg> Your catalog <span>↗</span></button><div class="sidebar-note">That familiar feeling.<br>A new beginning.</div></aside>
        <main id="main" tabindex="-1"></main>
      </div>
      <footer class="statusbar"><span id="catalog-status">Demo catalog</span><span><span class="green-dot"></span> Runs in your browser</span></footer>
    </div>
    <footer class="page-footer"><span>Inspired by 2012. Reconstructed in 2026.</span><div><a href="https://www.idownloadblog.com/2012/03/01/itweak-store-interview/" target="_blank" rel="noopener">The original story ↗</a><a href="https://github.com/syndicatedcr/itweak-store-rebuilt" target="_blank" rel="noopener">Source code ↗</a></div></footer>
  </div>
  <dialog id="detail" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
